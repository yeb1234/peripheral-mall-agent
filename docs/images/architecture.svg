<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#059669"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="780" fill="#f8fafc"/>
  <text x="40" y="52" font-size="24" font-weight="700" fill="#0f172a">P4Gear 智能电商中台 · 系统架构</text>
  <text x="40" y="78" font-size="13" fill="#64748b">多域客服编排 · 写操作管控 · PostgreSQL + pgvector · 三级信源对比</text>

  <!-- 前端 -->
  <rect x="40" y="104" width="300" height="104" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="60" y="132" font-size="15" font-weight="700" fill="#0f172a">前端应用</text>
  <text x="60" y="156" font-size="12.5" fill="#475569">React 18 + Vite + TypeScript</text>
  <text x="60" y="178" font-size="12.5" fill="#475569">商城 / 客服 / 工作台 / 语义实验台</text>
  <text x="60" y="198" font-size="12" fill="#94a3b8">SSE 流式对话 · 确认卡 · 审计视图</text>

  <!-- 接入层 -->
  <rect x="40" y="244" width="300" height="150" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="60" y="272" font-size="15" font-weight="700" fill="#0f172a">接入与安全层</text>
  <text x="60" y="296" font-size="12.5" fill="#475569">FastAPI async · buyer 签名凭证</text>
  <text x="60" y="318" font-size="12.5" fill="#475569">身份 + IP 双维度限流 · 语义去重</text>
  <text x="60" y="340" font-size="12.5" fill="#475569">注入归一化 · 出参 PII 打码</text>
  <text x="60" y="368" font-size="12" fill="#94a3b8">错误码 SYS / LLM / TOOL / SVC</text>

  <!-- 编排层 -->
  <rect x="400" y="104" width="420" height="290" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="420" y="132" font-size="15" font-weight="700" fill="#0f172a">LangGraph 编排层</text>
  <rect x="420" y="146" width="170" height="42" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="432" y="172" font-size="12.5" fill="#1e40af">understand · 语义理解</text>
  <rect x="610" y="146" width="190" height="42" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="622" y="172" font-size="12.5" fill="#1e40af">Supervisor · 意图派发</text>

  <rect x="420" y="214" width="116" height="72" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="436" y="240" font-size="12.5" fill="#166534">售前 Agent</text>
  <text x="436" y="262" font-size="11" fill="#4ade80">规格 / 库存 / 推荐</text>
  <rect x="552" y="214" width="116" height="72" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="568" y="240" font-size="12.5" fill="#166534">售中 Agent</text>
  <text x="568" y="262" font-size="11" fill="#4ade80">改址 / 取消 / 物流</text>
  <rect x="684" y="214" width="116" height="72" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="700" y="240" font-size="12.5" fill="#166534">售后 Agent</text>
  <text x="700" y="262" font-size="11" fill="#4ade80">退换修 / 补偿</text>

  <rect x="420" y="304" width="380" height="62" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="436" y="328" font-size="12.5" fill="#334155">确定性护栏 + 写操作六道关</text>
  <text x="436" y="350" font-size="11" fill="#64748b">身份 → 策略 → 确认 → 幂等 → 事务 → 审计</text>

  <!-- 工具层 -->
  <rect x="400" y="428" width="420" height="104" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="420" y="456" font-size="15" font-weight="700" fill="#0f172a">工具与执行层</text>
  <text x="420" y="480" font-size="12.5" fill="#475569">23 个业务工具（19 读 / 4 写）· 按域最小授权</text>
  <text x="420" y="502" font-size="12.5" fill="#475569">注册表白名单 · 参数 Schema 校验 · 审计留痕</text>
  <text x="420" y="522" font-size="12" fill="#94a3b8">对外 MCP：12 个工具（/mcp）</text>

  <!-- 存储 -->
  <rect x="40" y="428" width="300" height="224" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="60" y="456" font-size="15" font-weight="700" fill="#0f172a">数据与资产层</text>
  <rect x="60" y="470" width="260" height="54" rx="8" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="74" y="492" font-size="12.5" fill="#5b21b6">PostgreSQL 16 + pgvector</text>
  <text x="74" y="512" font-size="11" fill="#8b5cf6">26 商品 / 442 向量 / HNSW 余弦</text>
  <rect x="60" y="532" width="260" height="44" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="74" y="552" font-size="12.5" fill="#9a3412">Redis 7</text>
  <text x="74" y="570" font-size="11" fill="#c2410c">限流 / 去重 / 确认锁 / 抢购</text>
  <rect x="60" y="584" width="260" height="52" rx="8" fill="#f0f9ff" stroke="#bae6fd"/>
  <text x="74" y="606" font-size="12.5" fill="#0369a1">文件资产库</text>
  <text x="74" y="624" font-size="11" fill="#0ea5e9">元数据入库 · 正文落盘 · SHA256</text>

  <!-- 右侧系统 -->
  <rect x="880" y="104" width="280" height="128" rx="12" fill="#ffffff" stroke="#fecaca"/>
  <text x="900" y="132" font-size="15" font-weight="700" fill="#0f172a">P6 商品视频系统</text>
  <text x="900" y="156" font-size="12.5" fill="#475569">文案生成 / 视频管线</text>
  <text x="900" y="178" font-size="11.5" fill="#94a3b8">REST /api/copy/generate</text>
  <text x="900" y="198" font-size="11.5" fill="#94a3b8">MCP /mcp（1 工具）</text>
  <text x="900" y="220" font-size="11" fill="#b91c1c">跨 compose 经 host-gateway</text>

  <rect x="880" y="248" width="280" height="146" rx="12" fill="#ffffff" stroke="#fde68a"/>
  <text x="900" y="276" font-size="15" font-weight="700" fill="#0f172a">P3 参数与跑分库</text>
  <text x="900" y="300" font-size="12.5" fill="#475569">CPU / GPU / SoC 事实 + 评测</text>
  <text x="900" y="322" font-size="11.5" fill="#94a3b8">MCP compare / facts / search</text>
  <text x="900" y="342" font-size="11.5" fill="#94a3b8">带来源、置信度、冲突标记</text>
  <text x="900" y="370" font-size="11" fill="#b45309">第一信源 · 60s 缓存 + 单飞</text>

  <rect x="880" y="410" width="280" height="104" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="900" y="438" font-size="15" font-weight="700" fill="#0f172a">公开网络检索</text>
  <text x="900" y="462" font-size="12.5" fill="#475569">第二信源：只补内部库缺口</text>
  <text x="900" y="484" font-size="11.5" fill="#94a3b8">回复必须标注来源</text>

  <!-- 箭头 -->
  <line x1="190" y1="208" x2="190" y2="244" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="340" y1="300" x2="400" y2="240" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="610" y1="394" x2="610" y2="428" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="400" y1="480" x2="340" y2="480" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="820" y1="470" x2="880" y2="462" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="820" y1="200" x2="880" y2="168" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="820" y1="250" x2="880" y2="300" stroke="#d97706" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 图例 -->
  <rect x="40" y="690" width="420" height="0.1" fill="none"/>
  <text x="40" y="700" font-size="12" fill="#64748b">读数顺序：请求 → 接入层 → 编排层 → 工具层 → 数据层；对比类请求额外走 P3 → P6 → 公开网络。</text>
  <text x="40" y="724" font-size="12" fill="#94a3b8">图中数字为当前版本实测：23 工具 / 442 向量 / 26 商品 / 12 MCP 工具。</text>
</svg>
